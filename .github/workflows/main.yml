name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================
  #  Lint & Vet
  # ============================================================
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Go vet
        run: go vet ./cmd/any2claude/...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd/any2claude/)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
          echo "All files formatted correctly"

  # ============================================================
  #  Build — all platforms
  # ============================================================
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ldflags: "-s -w -H windowsgui"
            name: Any2Claude-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            ldflags: "-s -w"
            name: Any2Claude-darwin-amd64
          - goos: darwin
            goarch: arm64
            ldflags: "-s -w"
            name: Any2Claude-darwin-arm64
          - goos: linux
            goarch: amd64
            ldflags: "-s -w"
            name: Any2Claude-linux-amd64
          - goos: linux
            goarch: arm64
            ldflags: "-s -w"
            name: Any2Claude-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="${{ matrix.ldflags }}" -o ${{ matrix.name }} ./cmd/any2claude
          ls -lh ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          retention-days: 30

  # ============================================================
  #  Docker — verify Dockerfile builds
  # ============================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t any2claude:ci .

      - name: Verify image
        run: |
          docker run --rm any2claude:ci --help || true
          echo "Docker image built successfully"

  # ============================================================
  #  Summary
  # ============================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=== CI Results ==="
          echo "Build: ${{ needs.build.result }}"
          echo "Docker: ${{ needs.docker.result }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Build failed"
            exit 1
          fi
          echo "All checks passed!"
